<?xml version="1.0" encoding="UTF-8"?>
<!--
  R17-WP11 OG-image fallback for / (1200×630, brand-safe).
  Used by Slack/Telegram/Discord/etc. when a route has no explicit
  opengraph-image.tsx. Brand tokens (orange #E8590C) come from the
  Prism UI kit — keep this file in sync with globals.css.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF8F1"/>
      <stop offset="1" stop-color="#FFE9D6"/>
    </linearGradient>
    <style>
      .h1 { font: 700 76px "Inter","Helvetica Neue",Arial,sans-serif; fill: #1F1B16; }
      .h2 { font: 500 36px "Inter","Helvetica Neue",Arial,sans-serif; fill: #5C5044; }
      .pill { font: 600 22px "Inter",Arial,sans-serif; fill: #E8590C; }
      .domain { font: 500 24px "Inter","Helvetica Neue",Arial,sans-serif; fill: #9A8E80; letter-spacing: 0.04em; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Brand badge / pill -->
  <rect x="64" y="64" rx="22" ry="22" width="160" height="44" fill="#FFE5D2"/>
  <text x="84" y="93" class="pill">MULTI-CHEF</text>

  <!-- Tagline -->
  <text x="64" y="240" class="h1">Семейный планировщик</text>
  <text x="64" y="320" class="h1">питания</text>
  <text x="64" y="400" class="h2">Рецепты из того, что уже есть дома</text>

  <!-- Footer -->
  <text x="64" y="560" class="domain">Недельный план · Список покупок · КБЖУ</text>
  <text x="64" y="590" class="domain">192.168.1.95:8080</text>
</svg>
