name: hello CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  hello:
    name: hello
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Announce
        run: |
          echo "::group::Repo state"
          git log --oneline -n 5 || true
          echo "Files at root:"
          ls -la
          echo "::endgroup::"

      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v19
        # Config lives at .markdownlint-cli2.jsonc
