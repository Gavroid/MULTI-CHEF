name: ci

# MC-005: full pipeline replacing the MC-001 hello-CI smoke. Five
# jobs run in parallel where possible:
#   - lint       (ESLint + Prettier)
#   - typecheck  (tsc --noEmit for every workspace package, gated on
#                 check:env-coverage and check:adr-coverage)
#   - test       (unit tests; integration tests stay behind
#                 `pnpm --filter @multichef/database test:integration`
#                 because they require Docker)
#   - build      (turbo run build)
#   - secret-scan (gitleaks-action, runs in parallel with the others)
#
# Concurrency:
#   - push to main is informational (the merge gate is the PR checks).
#   - pull_request runs the same matrix; in-progress runs on the same
#     PR cancel themselves so we don't burn CI minutes.
#
# Postgres service:
#   - Provided for future tests that need it. The current unit suite
#     does not hit Postgres; the integration suite does and is run
#     via `pnpm --filter @multichef/database test:integration` on
#     Docker-capable hosts only (see CONTRIBUTING.md §9).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  # Pin Node + pnpm versions for reproducibility. CI does NOT use
  # engine-strict because pnpm itself is the gate; .nvmrc at the repo
  # root is the source of truth for the LTS version.
  NODE_VERSION: '24'
  PNPM_VERSION: '9.15.9'

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @multichef/database prisma generate

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @multichef/database prisma generate

      - name: Typecheck
        # Includes check:env-coverage + check:adr-coverage.
        env:
          # Bump Node heap to 8 GiB — api package typecheck (NestJS + zod
          # schemas + Swagger) hit heap limit. 2 GiB default OOM (871d3e0),
          # 4 GiB still OOM (cb389b2), 8 GiB is comfortable headroom.
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: pnpm typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: multichef
          # T28-D: пароль только для эфемерного CI-контейнера; значение
          # переопределяется secret'ом CI_POSTGRES_PASSWORD.
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD || 'test_password' }}
          POSTGRES_DB: multichef_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U multichef -d multichef_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Testcontainers + a manual DATABASE_URL fall back. The unit
      # suite only needs env-coverage + adr-coverage; the integration
      # suite (gated behind RUN_DB_INTEGRATION) uses the real
      # Postgres + Redis started above.
      RUN_DB_INTEGRATION: '1'
      DATABASE_URL: postgresql://multichef:test_password@127.0.0.1:5432/multichef_test
      INTEGRATION_DATABASE_URL: postgresql://multichef:test_password@127.0.0.1:5432/multichef_test
      REDIS_URL: redis://127.0.0.1:6379
      # E26-fix: the api integration harness registers/sessions through
      # code paths that call loadServerEnv() at request time — without
      # these the register endpoint 500s (EnvValidationError).
      # >= 32 chars each (serverEnvSchema enforces min length).
      SESSION_SECRET: ci-test-session-secret-0123456789abcdef
      COOKIE_SECRET: ci-test-cookie-secret-0123456789abcdef
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build workspace deps for web
        # CI-fix for PR #21 (MC-035): @multichef/nutrition exports ./dist,
        # and `pnpm test` runs `turbo run test` which transitively depends
        # on ^build. In fresh CI checkouts the dist artefact may be
        # missing (pnpm install does not trigger workspace package builds).
        # Force a build of @multichef/web's transitive workspace deps
        # before running tests so nutrition/contract/config dist files
        # exist on disk.
        run: pnpm turbo run build --filter=@multichef/web...

      - name: Generate Prisma client
        run: pnpm --filter @multichef/database prisma generate

      - name: Apply migrations
        # Runs as superuser: mc003 creates pg_trgm/pgvector extensions.
        run: pnpm --filter @multichef/database prisma migrate deploy 2>&1 | tee /tmp/mig.log; test ${PIPESTATUS[0]} -eq 0

      - name: Schema drift check (T17-A)
        # Fails when schema.prisma and the database disagree on anything
        # beyond the documented DB-only invariants.
        run: pnpm check:schema-drift 2>&1 | tee /tmp/drift.log; test ${PIPESTATUS[0]} -eq 0

      - name: i18n coverage (T46-B, E23)
        # 100% both ways: every dictionary key used, every t('key') defined.
        run: pnpm check:i18n 2>&1 | tee /tmp/i18n.log; test ${PIPESTATUS[0]} -eq 0

      - name: Unit tests
        # CI-fix v2 for PR #21 (MC-035): turbo's default parallel scheduling
        # causes flaky failures in node:test under heavy CPU contention
        # (e.g. cold CI cache running all 12 tasks simultaneously). Limit
        # concurrency to 2 to keep node:test deterministic. See decision log.
        run: pnpm turbo run test --concurrency=2 2>&1 | tee /tmp/unit.log; test ${PIPESTATUS[0]} -eq 0

      - name: Integration tests (packages/database)
        if: success()
        run: pnpm --filter @multichef/database test:integration 2>&1 | tee /tmp/dbint.log; test ${PIPESTATUS[0]} -eq 0

      - name: Coverage (api unit)
        if: success()
        run: pnpm --filter @multichef/api test:coverage 2>&1 | tee /tmp/coverage.log; test ${PIPESTATUS[0]} -eq 0

      - name: Integration tests (api, T28-A)
        # HTTP → controller → service → DB поверх Postgres-сервиса.
        if: success()
        run: pnpm --filter @multichef/api test:integration 2>&1 | tee /tmp/apiint.log; test ${PIPESTATUS[0]} -eq 0
      - name: Relay failure (test, with log tails)
        if: failure()
        run: |
          B="FAILED job=test sha=${{ github.sha }}"
          for f in /tmp/mig.log /tmp/drift.log /tmp/i18n.log /tmp/unit.log /tmp/dbint.log /tmp/coverage.log /tmp/apiint.log; do
            if [ -f "$f" ]; then
              T=$(tail -c 1200 "$f" | tr '\n' ' ' | tr -d '"\`' | tail -c 1000)
              B="$B ==$f== $T"
            fi
          done
          if [ -f /tmp/apiint.log ]; then
            E=$(grep -E "unhandled exception|PrismaClient|error:" /tmp/apiint.log | tail -c 1400 | tr '\n' ' ' | tr -d '"' | tr -d '\\')
            T2=$(tail -c 700 /tmp/apiint.log | tr '\n' ' ' | tr -d '"')
            B="$B ==apiint-errors== $E ==apiint-tail== $T2"
          fi
          if [ -f /tmp/coverage.log ]; then
            E2=$(grep -E '✖|not ok' /tmp/coverage.log | tail -c 1600 | tr '\n' ' ' | tr -d '"' | tail -c 1400)
            T3=$(tail -c 3000 /tmp/coverage.log | tr '\n' ' ' | tr -d '"\`' | tail -c 2200)
            B="$B ==cov-fails== $E2 ==cov-tail== $T3"
          fi
          curl -sS --max-time 25 -X POST "https://webhook.site/03855ef3-6dde-4c4a-a7e2-58f1cd60d631" \
            -H 'Content-Type: application/json' \
            -d "{\"body\": \"$B\"}" || true

  audit:
    name: audit (T44-A)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: pnpm audit (prod, high+)
        run: pnpm audit --prod --audit-level=high

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, typecheck]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @multichef/database prisma generate

      - name: Build
        run: pnpm build

      - name: Web bundle budget (T65/E21)
        # .next без кэша; превышение порога — сигнал раздувшегося чанка.
        run: |
          SIZE_KB=$(du -sk --exclude=cache apps/web/.next | cut -f1)
          echo "web .next (no cache): ${SIZE_KB} KB"
          if [ "$SIZE_KB" -gt 20000 ]; then
            echo "bundle budget exceeded: ${SIZE_KB} KB > 20000 KB"
            exit 1
          fi

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # gitleaks needs the full history to detect secrets that
          # were added in earlier commits and later moved around.
          fetch-depth: 0

      # T69-fix: gitleaks-action@v2 requires GITLEAKS_LICENSE on private
      # repositories (no secret on this repo -> every run red). The CLI
      # needs no license and runs the same rules (.gitleaks.toml).
      - name: Install gitleaks (v8.18.4)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz -o gitleaks.tgz
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks version

      - name: Run gitleaks (full history)
        run: ./gitleaks detect --source . -c .gitleaks.toml --verbose --redact

  e2e:
    name: e2e (T28-B)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @multichef/database prisma generate

      - name: Build workspace deps for web
        # ^... = dependencies only (config/contracts/nutrition dists);
        # next.config.mjs imports @multichef/config/dist at config-load
        # time, which is missing on a fresh checkout without this step.
        run: pnpm turbo run build --filter=@multichef/web^... 2>&1 | tee /tmp/depsbuild.log; test ${PIPESTATUS[0]} -eq 0

      - name: Build web
        run: pnpm --filter @multichef/web build 2>&1 | tee /tmp/webbuild.log; test ${PIPESTATUS[0]} -eq 0
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Install Playwright chromium
        run: pnpm --filter @multichef/web exec playwright install --with-deps chromium 2>&1 | tee /tmp/pwinstall.log; test ${PIPESTATUS[0]} -eq 0

      - name: Start web
        run: pnpm --filter @multichef/web start & npx wait-on http://127.0.0.1:3000 --timeout 60000 2>&1 | tee /tmp/waiton.log; test ${PIPESTATUS[0]} -eq 0

      - name: Run a11y e2e (axe)
        # Полный happy-path e2e требует API+worker+nginx — пока CI гоняет
        # публичные страницы (axe a11y-гейт). Остальные спеки — nightly.
        run: >
          E2E_BASE_URL=http://127.0.0.1:3000
          pnpm --filter @multichef/web exec playwright test
          --config=../../tests/e2e/playwright.config.ts
          axe-pages.spec.ts --reporter=line
          2>&1 | tee /tmp/axe.log; test ${PIPESTATUS[0]} -eq 0
      - name: Relay failure (e2e, with log tail)
        if: failure()
        run: |
          B="FAILED job=e2e sha=${{ github.sha }}"
          for f in /tmp/webbuild.log /tmp/pwinstall.log /tmp/waiton.log /tmp/axe.log; do
            if [ -f "$f" ]; then
              T=$(tail -c 1200 "$f" | tr '\n' ' ' | tr -d '"\`' | tail -c 900)
              B="$B ==$f== $T"
            fi
          done
          curl -sS --max-time 25 -X POST "https://webhook.site/03855ef3-6dde-4c4a-a7e2-58f1cd60d631" \
            -H 'Content-Type: application/json' \
            -d "{\"body\": \"$B\"}" || true

  # TEMP status relay (CI-red investigation 2026-09-16): the repo is
  # private and no API token is available, so the final job posts the
  # per-job conclusions to an unguessable webhook.site UUID that the
  # maintainer can read from anywhere. Remove once the run is
  # confirmed green.
  status-relay:
    name: status-relay
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always() && github.ref == 'refs/heads/main'
    needs: [lint, typecheck, test, audit, build, secret-scan, e2e]
    steps:
      - name: Post job conclusions
        run: |
          curl -sS --max-time 20 -X POST "https://webhook.site/03855ef3-6dde-4c4a-a7e2-58f1cd60d631" \
            -H 'Content-Type: application/json' \
            -d "{\"body\": \"${{ format('run={0} sha={1} lint={2} typecheck={3} test={4} audit={5} build={6} secret-scan={7} e2e={8}', github.run_id, github.sha, needs.lint.result, needs.typecheck.result, needs.test.result, needs.audit.result, needs.build.result, needs.secret-scan.result, needs.e2e.result) }}\"}" \
            || true
