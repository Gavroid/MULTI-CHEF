# MC-071 — MULTI-CHEF gateway (prod host 192.168.1.95 (migrated from .35)).
#
# The host's default_server on :80 belongs to Hermes — MULTI-CHEF gets
# its own block on :8080 (http) and :8443 (TLS via self-signed cert,
# see infrastructure/scripts/bootstrap.sh). web:3000 / api:3001 stay on
# 127.0.0.1 only; the proxy_pass targets keep the /api/v1 path intact.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    client_max_body_size 10m;

    # Audit round-6: compress JSON/API responses (nginx default skips
    # text/* only for html).
    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Frame-Options DENY always;

    # R20 F5/F6: legacy location /images/ удалён (MC-200 — фото рецептов
    # не отдаются; E24-картинки — через /api/v1/images/* + X-Accel /_storage/).
    location /_storage/ {
        # T54-C (E24): internal storage — reachable ONLY via
        # X-Accel-Redirect from the API (authorises the key shape).
        internal;
        alias /var/www/multichef-images/storage/;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # R20 F7: middleware строит redirect из forwarded host+port —
        # без порта Location уводит браузер на :80 (мимо шлюза).
        proxy_set_header X-Forwarded-Host $host:$server_port;
    }


    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # R20 F7: middleware строит redirect из forwarded host+port —
        # без порта Location уводит браузер на :80 (мимо шлюза).
        proxy_set_header X-Forwarded-Host $host:$server_port;
    }
}

# TLS variant — certificate is self-signed on the LAN (bootstrap.sh);
# swap in Let's Encrypt files when a public domain exists.
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/multichef.crt;
    ssl_certificate_key /etc/nginx/ssl/multichef.key;
    client_max_body_size 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options DENY always;

    location /_storage/ {
        # T54-C (E24): internal storage — reachable ONLY via
        # X-Accel-Redirect from the API (authorises the key shape).
        internal;
        alias /var/www/multichef-images/storage/;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }


    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
