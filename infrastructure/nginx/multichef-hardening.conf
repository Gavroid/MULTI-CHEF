# R17-WP15 nginx hardening delta.
# Adds:
#   - server_tokens off           (hide nginx version)
#   - Content-Security-Policy     (CSP — read from env if available)
#   - limit_req zone=auth         (10 r/m against /auth/* paths)
#   - keep all existing MC-071 + R20 settings

# server_tokens is already set off in /etc/nginx/nginx.conf — no need
# to repeat here.

# Define the auth rate-limit zone (1MB bucket ≈ 16k IPs at 64 bytes).
# 10 requests per minute per IP — the auth surface tolerates burst
# (login + 2fa + retry) but slams on bad actors.
limit_req_zone $binary_remote_addr zone=auth:1m rate=10r/m;

# Optional CSP value. Production should set a stricter policy; the
# fallback below mirrors what Next.js emits when no override exists.
map $host $multichef_csp {
    default "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'";
}
